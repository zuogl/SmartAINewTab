name: Bug report
description: 报告可复现的 SmartAINewTab 问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请不要提交公开 Issue，请按 SECURITY.md 使用私密渠道。
        不要粘贴 API Key、Token、Cookie、恢复密码或完整书签导出。
  - type: input
    id: version
    attributes:
      label: SmartAINewTab 版本
      placeholder: 例如 0.1.29
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome 与操作系统版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用去敏后的最小示例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除密钥、Token、Cookie、恢复密码、邮箱和私人书签内容。
          required: true
