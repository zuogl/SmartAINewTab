version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      root-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      root-minor-and-patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Keep updates compatible with the project's current Node 22 development baseline.
    ignore:
      - dependency-name: jsdom
        versions:
          - ">=30.0.0"
      - dependency-name: "@icons-pack/react-simple-icons"
        versions:
          - ">=13.11.2"
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      - dependency-name: vitest
        versions:
          - ">=4.0.0"
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      worker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      worker-minor-and-patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
