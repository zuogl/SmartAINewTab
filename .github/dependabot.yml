version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      root-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      root-minor-and-patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      worker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      worker-minor-and-patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
